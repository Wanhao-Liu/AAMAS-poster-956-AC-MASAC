<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Poster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; font-family: sans-serif; }
    header {
      background: #2d2d2d;
      color: white;
      padding: 16px 24px;
      text-align: center;
      font-size: 18px;
    }
    iframe {
      display: block;
      width: 100vw;
      height: calc(100vh - 52px);
      border: none;
    }
  </style>
</head>
<body>
  <header>Research Poster</header>
  <iframe src="poster.pdf"></iframe>
</body>
</html>
